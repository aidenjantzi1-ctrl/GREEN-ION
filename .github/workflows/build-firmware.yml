name: Build Green Ion firmware

on:
  push:
    branches: [main]
    paths:
      - "Green_Ion_V9/**"
      - "tests/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 board package
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit BMP3XX Library"
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Validate dashboard JavaScript and markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('Green_Ion_V9/Dashboard.h').read_text()
          match = re.search(r'<script>(.*?)</script>', s, re.S)
          assert match, 'Dashboard script missing'
          ids = re.findall(r'\bid="([^"]+)"', s)
          assert len(ids) == len(set(ids)), 'Duplicate dashboard id'
          refs = re.findall(r'\$\("([^"]+)"\)', match.group(1))
          missing = sorted(set(refs) - set(ids))
          assert not missing, f'Dashboard references unknown IDs: {missing}'
          Path('/tmp/green-ion-dashboard.js').write_text(match.group(1))
          print(f'Checked {len(ids)} IDs and {len(refs)} references')
          PY
          node --check /tmp/green-ion-dashboard.js

      - name: Test RKT4 integrity and interrupted-flight recovery
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile V9
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:adafruit_feather_esp32_v2 --output-dir build Green_Ion_V9

      - name: Package phone-downloadable firmware
        uses: actions/upload-artifact@v4
        with:
          name: green-ion-v9-phone-update
          path: |
            build/Green_Ion_V9.ino.bin
            Green_Ion_V9/Green_Ion_V9.ino
            Green_Ion_V9/Dashboard.h
          if-no-files-found: error
