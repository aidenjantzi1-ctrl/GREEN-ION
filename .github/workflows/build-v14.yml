name: GREEN ION V16.3 - verify, compile and package
on:
  push:
    branches: [main, "v14/**", "v16.2/**", "v16.3/**"]
    paths:
      - "web/**"
      - "Green_Ion_V14/**"
      - "Green_Ion_V16_3/**"
      - "Green_Ion_V16_3/**"
      - "Ground_Receiver/**"
      - "Ground_Receiver_V16_3/**"
      - "Ground_Receiver_V16_3/**"
      - "Ground_Station/**"
      - "tools/build_v16_windows_package.py"
      - "tools/assemble_v16_release.py"
      - "START_GREEN_ION.cmd"
      - "UPDATE_GREEN_ION.cmd"
      - "ROLLBACK_GREEN_ION.cmd"
      - "libraries/**"
      - "tests/**"
      - ".github/workflows/build-v14.yml"
      - ".github/workflows/release-v16.yml"
      - "docs/V14_*"
      - "docs/V16_*"
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://bqvvtbnjthbiqyljmzfx.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_m8GYtLRB9LKT2bPzxVMESA_yhlgIAZR

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Native shared-SPI scheduler regression
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
            -I libraries/GreenIonProtocol/src \
            tests/cpp/test_v16_3_shared_spi.cpp \
            -o /tmp/test-v16-3-shared-spi
          /tmp/test-v16-3-shared-spi
      - name: Node browser tests
        run: node --test tests/v14_browser.test.mjs tests/v14_analysis.test.mjs tests/v14_ui.test.mjs tests/v14_sensor.test.mjs tests/v14_gis1.test.mjs tests/v15_features.test.mjs tests/v15_hosted_link.test.mjs tests/v16_windows_reliability.test.mjs tests/v16_unified_telemetry.test.mjs tests/v16_mission.test.mjs tests/v16_navigation.test.mjs tests/v16_layout.test.mjs tests/v16_data_cloud.test.mjs tests/v16_visualization.test.mjs tests/v16_validation.test.mjs tests/v16_1_improvements.test.mjs tests/v16_1_sd_delete.test.mjs tests/v16_2_features.test.mjs tests/v16_2_webgl.test.mjs
      - name: Headless browser WebGL rendering smoke test
        run: node tests/v16_2_render_browser.mjs
      - name: JavaScript syntax verification
        run: |
          for f in web/*.mjs web/analysis/*.mjs web/v14_boot.js web/service-worker.js web/build.mjs; do
            node --check "$f"
          done
          node --check Ground_Station/v13_unified.js
      - name: Build the installable blue website
        run: node web/build.mjs
      - name: Validate hosted site assets
        run: |
          test -s web/dist/index.html
          test -s web/dist/config.js
          test -s web/dist/service-worker.js
          grep -q 'data-tab="status">Dashboard</button>' web/dist/index.html
          grep -q 'data-tab="flight">Flight</button>' web/dist/index.html
          grep -q 'data-tab="history">Flights &amp; Analysis</button>' web/dist/index.html
          grep -q 'data-tab="testing">Testing</button>' web/dist/index.html
          grep -q 'data-tab="system">Settings &amp; Advanced</button>' web/dist/index.html
          grep -q 'id="v16DashboardSummary"' web/dist/index.html
          grep -q 'id="v16LegacyTabs" hidden' web/dist/index.html
          test -s web/dist/v16_layout.mjs
          test -s web/dist/v16_navigation.mjs
          test -s web/dist/v16_data.mjs
          test -s web/dist/v16_runtime.mjs
          test -s web/dist/v16_visualization.mjs
          test -s web/dist/v16_visualization_worker.mjs
          test -s web/dist/v16_validation.mjs
          test -s web/dist/v16_1_diagnostics.mjs
          test -s web/dist/v16_1_guided_test.mjs
          test -s web/dist/v16_1_analysis_core.mjs
          test -s web/dist/v16_2_dashboard.mjs
          test -s web/dist/v16_2_webgl.mjs
          test -s web/dist/v16_2_map.mjs
          test -s web/dist/v16_2_sd_manager.mjs
          test -s web/dist/v16_2_compare.mjs
          test -s web/dist/v16_2_compare_worker.mjs
          test -s web/dist/v16_2_testing.mjs
          test -s web/dist/v16_2_experience.mjs
          test -s web/dist/v16_2_scorecard.mjs
          grep -q 'id="homeAuto"' web/dist/index.html
          grep -q 'id="v15ConnectFeather"' web/dist/index.html
          grep -q 'GREEN ION V16' web/dist/index.html
          test -s web/dist/v15_report_worker.mjs
          test -s web/dist/v15_help.mjs
          grep -q 'id="v14SensorLabCard"' web/dist/index.html
          grep -q 'id="v14SensorArchiveCard"' web/dist/index.html
          test -s web/dist/sensor-worker.mjs
          test -s web/dist/analysis/gis1.mjs
          grep -q 'GREEN ION V16' web/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: green-ion-v16-3-web
          path: web/dist/
          if-no-files-found: error

  windows-package:
    needs: app-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: green-ion-v16-3-web
          path: built-web
      - name: Parse Windows PowerShell launch/update scripts
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("Ground_Station/Start-GreenIon.ps1",[ref]$null,[ref]$errors)
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("Ground_Station/Update-GreenIon.ps1",[ref]$null,[ref]$errors)
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("Ground_Station/Rollback-GreenIon.ps1",[ref]$null,[ref]$errors)
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Build V16 Windows package
        run: python3 tools/build_v16_windows_package.py --website built-web --output windows-release --commit "$GITHUB_SHA"
      - name: Validate Windows package
        run: |
          test -s windows-release/GREEN_ION_V16_WINDOWS.zip
          test -s windows-release/GREEN_ION_V16_WINDOWS.sha256
          test -s windows-release/GREEN_ION_V16_WINDOWS_MANIFEST.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          root=Path("windows-release")
          z=root/"GREEN_ION_V16_WINDOWS.zip"
          expected=(root/"GREEN_ION_V16_WINDOWS.sha256").read_text().split()[0]
          assert hashlib.sha256(z.read_bytes()).hexdigest()==expected
          with ZipFile(z) as a:
            names=set(a.namelist())
          required={
            "GREEN_ION_V16_WINDOWS/START_GREEN_ION.cmd",
            "GREEN_ION_V16_WINDOWS/UPDATE_GREEN_ION.cmd",
            "GREEN_ION_V16_WINDOWS/ROLLBACK_GREEN_ION.cmd",
            "GREEN_ION_V16_WINDOWS/Ground_Station/ground_station.py",
            "GREEN_ION_V16_WINDOWS/Ground_Station/Start-GreenIon.ps1",
            "GREEN_ION_V16_WINDOWS/Ground_Station/Update-GreenIon.ps1",
            "GREEN_ION_V16_WINDOWS/Ground_Station/Rollback-GreenIon.ps1",
            "GREEN_ION_V16_WINDOWS/Ground_Station/version.json",
            "GREEN_ION_V16_WINDOWS/web/index.html",
          }
          missing=required-names
          assert not missing, missing
          m=json.loads((root/"GREEN_ION_V16_WINDOWS_MANIFEST.json").read_text())
          assert m["zipSha256"]==expected
          assert m["safety"]["preservesUserData"] is True
          assert m["safety"]["rollbackRetainsPriorApp"] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GREEN_ION_V16_WINDOWS
          path: |
            windows-release/GREEN_ION_V16_WINDOWS.zip
            windows-release/GREEN_ION_V16_WINDOWS.sha256
            windows-release/GREEN_ION_V16_WINDOWS_MANIFEST.json
          if-no-files-found: error

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install board cores
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Install required firmware libraries
        run: |
          arduino-cli lib install "Adafruit BMP3XX Library"
          arduino-cli lib install "Adafruit LSM6DS"
          arduino-cli lib install "Adafruit GPS Library"
          arduino-cli lib install "RadioHead"
      - name: Compile Feather ESP32 V2 from source
        run: arduino-cli compile --fqbn esp32:esp32:adafruit_feather_esp32_v2 --library libraries/GreenIonProtocol --library libraries/GreenIonRecorder --output-dir build/feather Green_Ion_V16_3
      - name: Compile Arduino Uno receiver from source
        run: arduino-cli compile --fqbn arduino:avr:uno --library libraries/GreenIonProtocol --output-dir build/uno Ground_Receiver_V16_3
      - uses: actions/upload-artifact@v4
        with:
          name: green-ion-v16-3-firmware
          path: |
            build/feather/*.bin
            build/uno/*.hex
          if-no-files-found: error

  v16-release-smoke:
    needs: [app-tests, firmware-build, windows-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: green-ion-v16-3-web
          path: built-web
      - uses: actions/download-artifact@v4
        with:
          name: green-ion-v16-3-firmware
          path: built-firmware
      - uses: actions/download-artifact@v4
        with:
          name: GREEN_ION_V16_WINDOWS
          path: windows-release
      - name: Assemble V16 release assets without publishing
        run: |
          python3 tools/assemble_v16_release.py \
            --web built-web \
            --firmware built-firmware \
            --windows windows-release \
            --output v16-release-smoke \
            --tag "ci-smoke" \
            --commit "$GITHUB_SHA"
      - name: Validate V16 release bundle
        run: |
          test -s v16-release-smoke/GREEN_ION_V16_WINDOWS.zip
          test -s v16-release-smoke/GREEN_ION_V16_WEB.zip
          test -s v16-release-smoke/Green_Ion_V16_3.ino.bin
          test -s v16-release-smoke/Ground_Receiver_V16_3.ino.hex
          test -s v16-release-smoke/GREEN_ION_V16_3_SOURCE.zip
          test -s v16-release-smoke/SHA256_MANIFEST.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("v16-release-smoke")
          manifest=json.loads((root/"SHA256_MANIFEST.json").read_text())
          assert manifest["schema"]=="GREEN-ION-V16-RELEASE-1"
          assert manifest["safety"]["loraReceiveOnly"] is True
          assert manifest["safety"]["autonomousSdRecorderPreserved"] is True
          assert manifest["firmwareGeneration"]=="V16.3"
          assert manifest["receiverGeneration"]=="V16.3"
          assert manifest["radioProtocolVersion"]==2
          assert manifest["radioPacketBytes"]==70
          for name,item in manifest["artifacts"].items():
              path=root/name
              assert path.is_file(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item["sha256"], name
              assert path.stat().st_size==item["size"], name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GREEN_ION_V16_RELEASE_SMOKE
          path: v16-release-smoke/
          if-no-files-found: error


  publish-v16-3:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app-tests, firmware-build, windows-package, v16-release-smoke]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: green-ion-v16-3-web
          path: built-web
      - uses: actions/download-artifact@v4
        with:
          name: green-ion-v16-3-firmware
          path: built-firmware
      - uses: actions/download-artifact@v4
        with:
          name: GREEN_ION_V16_WINDOWS
          path: windows-release
      - name: Assemble final V16.3 release assets
        run: |
          python3 tools/assemble_v16_release.py \
            --web built-web \
            --firmware built-firmware \
            --windows windows-release \
            --output release \
            --tag "v16.3.0" \
            --commit "$GITHUB_SHA"
      - name: Verify final release manifest before publication
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("release")
          m=json.loads((root/"SHA256_MANIFEST.json").read_text())
          assert m["tag"]=="v16.3.0"
          assert m["firmwareGeneration"]=="V16.3"
          assert m["receiverGeneration"]=="V16.3"
          assert m["radioProtocolVersion"]==2
          assert m["radioPacketBytes"]==70
          for name,item in m["artifacts"].items():
              p=root/name
              assert p.is_file(), name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item["sha256"], name
              assert p.stat().st_size==item["size"], name
          PY
      - name: Publish immutable V16.3 release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v16.3.0 >/dev/null 2>&1; then
            echo "v16.3.0 already exists; refusing to replace an existing stable release."
            exit 0
          fi
          gh release create v16.3.0 release/* \
            --target "$GITHUB_SHA" \
            --title "GREEN ION V16.3" \
            --notes-file docs/V16_RELEASE_NOTES.md
