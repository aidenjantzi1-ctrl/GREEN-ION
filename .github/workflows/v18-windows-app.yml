name: V18 Windows desktop application (no release)
on:
  push:
    branches: [worker/v18-windows-app]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.11.1 pillow==11.0.0
          choco install innosetup --no-progress -y
      - name: Full software regression suite
        shell: pwsh
        env: {PYTHONUTF8: '1'}
        run: |
          node --test tools/v18_contract_gate.test.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $nodeTests=@(Get-ChildItem tests -Filter "*.test.mjs" -File|%{$_.FullName})
          node --test @nodeTests
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build offline web
        shell: pwsh
        run: node web/build.mjs
      - name: Build GREEN_ION.exe
        shell: pwsh
        run: |
          python tools/make_windows_icon.py --output build/GREEN_ION.ico
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GREEN_ION --icon build/GREEN_ION.ico --paths Ground_Station --add-data "web;web" --add-data "Ground_Station/desktop_version.json;Ground_Station" Ground_Station/desktop_app.py
          if (-not (Test-Path dist/GREEN_ION.exe)) { throw "GREEN_ION.exe missing" }
      - name: Packaged executable localhost and duplicate-start smoke
        shell: pwsh
        run: |
          $first=Start-Process ".\dist\GREEN_ION.exe" -ArgumentList @("--no-browser","--http-port","18765","--test-exit-after","14") -PassThru
          Start-Sleep 3
          $page=Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:18765/v18-offline.html"
          if($page.StatusCode-ne 200 -or $page.Content-notmatch "Flight" -or $page.Content-notmatch "Recovery" -or $page.Content-notmatch "Data" -or $page.Content-notmatch "Settings"){throw "Packaged UI smoke failed"}
          $u=Invoke-RestMethod "http://127.0.0.1:18765/api/app/update/status";if($u.release_only-ne $true){throw "Updater endpoint missing"}
          $second=Start-Process ".\dist\GREEN_ION.exe" -ArgumentList @("--no-browser","--http-port","18765") -PassThru -Wait
          if($second.ExitCode-ne 0){throw "Duplicate instance failed"}
          Wait-Process -Id $first.Id -Timeout 25
          if($first.ExitCode-ne 0){throw "App smoke failed"}
      - name: Build installer
        shell: pwsh
        run: |
          $version=(Get-Content Ground_Station/desktop_version.json -Raw|ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\GREEN_ION.iss"
          if($LASTEXITCODE-ne 0){exit 1}
      - name: Fresh install and uninstall smoke
        shell: pwsh
        run: |
          $target=Join-Path $env:TEMP "GREEN_ION_CI_INSTALL";Remove-Item -Recurse -Force $target -EA SilentlyContinue
          $p=Start-Process ".\installer-output\GREEN_ION_Setup.exe" -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$target") -PassThru -Wait
          if($p.ExitCode-ne 0 -or -not(Test-Path "$target\GREEN_ION.exe")){throw "Fresh install failed"}
          $v=Start-Process "$target\GREEN_ION.exe" -ArgumentList "--version" -PassThru -Wait;if($v.ExitCode-ne 0){throw "Installed app failed"}
          $x=Start-Process "$target\unins000.exe" -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART") -PassThru -Wait;if($x.ExitCode-ne 0){throw "Uninstall failed"}
      - name: Build checksums and manifest
        shell: pwsh
        run: |
          $version=(Get-Content Ground_Station/desktop_version.json -Raw|ConvertFrom-Json).version
          python tools/package_v18_windows.py --exe dist/GREEN_ION.exe --setup installer-output/GREEN_ION_Setup.exe --output windows-artifacts --version $version --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: GREEN_ION_V18_WINDOWS_APP
          path: |
            windows-artifacts/GREEN_ION.exe
            windows-artifacts/GREEN_ION.exe.sha256
            windows-artifacts/GREEN_ION_Setup.exe
            windows-artifacts/GREEN_ION_Setup.exe.sha256
            windows-artifacts/GREEN_ION_Windows_manifest.json
            docs/V18/WINDOWS_APP.md
          if-no-files-found: error
