<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREEN ION Offline Analyzer</title><style>body{font:16px system-ui;margin:auto;max-width:760px;padding:20px;background:#07100d;color:#e9fff1}main{display:grid;gap:16px}label,.card{padding:18px;border:1px solid #28654b;border-radius:12px;background:#0d1b15}input{display:block;margin-top:12px}table{width:100%;border-collapse:collapse}td{padding:7px;border-bottom:1px solid #254}small{color:#b8d5c5}</style><main><h1>GREEN ION Offline Analyzer</h1><p>Import an original RKT4 BIN file. This page is offline-only: it cannot arm, record, control, or update a Feather.</p><label>Choose BIN file<input id="file" type="file" accept=".bin,application/octet-stream"></label><section id="result" class="card" hidden></section><section id="warning" class="card" hidden></section></main><script type="module">import{parseRkt4,analyzeFlight}from'./analysis/rkt4.mjs';const $=id=>document.getElementById(id);$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const a=analyzeFlight(parseRkt4(new Uint8Array(await f.arrayBuffer())));$('result').hidden=false;$('result').innerHTML=`<h2>${f.name}</h2><table><tr><td>Samples</td><td>${a.samples.length}</td></tr><tr><td>Rate</td><td>${a.rateHz} Hz</td></tr><tr><td>Peak altitude</td><td>${a.peakAltitudeM.toFixed(1)} m (estimated)</td></tr><tr><td>Max ascent</td><td>${a.maxAscentMps.toFixed(1)} m/s (estimated)</td></tr></table>`;$('warning').hidden=false;$('warning').innerHTML='<strong>Analysis warnings</strong><br>'+a.warnings.join('<br>')}catch(err){$('result').hidden=true;$('warning').hidden=false;$('warning').textContent=`Could not analyze file: ${err.message}`}});</script></html>
