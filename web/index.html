<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="./manifest.webmanifest"><title>GREEN ION Offline Analyzer</title><style>body{font:16px system-ui;margin:auto;max-width:900px;padding:18px;background:#07100d;color:#e9fff1}.card{padding:16px;border:1px solid #28654b;border-radius:12px;background:#0d1b15;margin:12px 0}button,input{margin:6px;padding:9px}table{width:100%}td{padding:6px;border-bottom:1px solid #254}canvas{width:100%;height:190px;background:#020806}small{color:#b8d5c5}</style><main><h1>GREEN ION Offline Analyzer</h1><p>Analyze original RKT4 BIN files locally. This analyzer cannot arm, record, control, or update a Feather.</p><section class="card"><input id="file" type="file" accept=".bin,application/octet-stream"><button id="csv" disabled>Download CSV</button><button id="report" disabled>Download report</button></section><section id="result" class="card" hidden></section><canvas id="chart" width="820" height="190"></canvas><section class="card"><h2>Local flight history</h2><button id="clear">Clear local history</button><div id="history"></div><small>History is stored only in this browser. Original BIN files are never altered or uploaded.</small></section><section id="warning" class="card" hidden></section></main><script type="module">const $=id=>document.getElementById(id);let current,worker=new Worker('./analysis-worker.mjs',{type:'module'});const dl=(name,text,type)=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)};function history(){let h=JSON.parse(localStorage.getItem('green-ion-history')||'[]');$('history').innerHTML=h.length?h.map(x=>`<div>${x.name}: ${Number(x.peakAltitudeM).toFixed(1)} m · ${x.samples} samples</div>`).join(''):'No locally saved analyses.'}function draw(a){let c=$('chart'),x=c.getContext('2d'),s=a.samples.filter(v=>Number.isFinite(v.altitudeM));x.clearRect(0,0,c.width,c.height);if(s.length<2)return;let peak=Math.max(...s.map(v=>v.altitudeM),1);x.strokeStyle='#47e58c';x.beginPath();s.forEach((v,i)=>{let px=i*(c.width/(s.length-1)),py=c.height-(v.altitudeM/peak)*(c.height-12)-6;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}worker.onmessage=e=>{if(e.data.error){$('warning').hidden=false;$('warning').textContent=e.data.error;return}current=e.data;$('result').hidden=false;let a=e.data.analysis;$('result').innerHTML=`<h2>${e.data.report.name}</h2><table><tr><td>Peak altitude</td><td>${a.peakAltitudeM.toFixed(1)} m estimated</td></tr><tr><td>Max ascent</td><td>${a.maxAscentMps.toFixed(1)} m/s estimated</td></tr><tr><td>Samples</td><td>${a.samples.length} at ${a.rateHz} Hz</td></tr><tr><td>Phases</td><td>${a.phases.map(p=>p.name).join(', ')||'None estimated'}</td></tr></table>`;$('warning').hidden=false;$('warning').innerHTML=a.warnings.join('<br>');$('csv').disabled=$('report').disabled=false;let h=JSON.parse(localStorage.getItem('green-ion-history')||'[]');h.unshift(e.data.report);localStorage.setItem('green-ion-history',JSON.stringify(h.slice(0,50)));history();draw(a)};$('file').onchange=async e=>{let f=e.target.files[0];if(f)worker.postMessage({id:Date.now(),name:f.name,bytes:await f.arrayBuffer()})};$('csv').onclick=()=>dl('green-ion-analysis.csv',current.csv,'text/csv');$('report').onclick=()=>dl('green-ion-report.json',JSON.stringify(current.report,null,2),'application/json');$('clear').onclick=()=>{localStorage.removeItem('green-ion-history');history()};history();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');</script></html>
